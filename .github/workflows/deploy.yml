name: Secure-Centric Production Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  validate:
    name: Code Quality & Theme Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint Theme PHP Files
        run: |
          find wp-content/themes/secure-centric -name "*.php" -exec php -l {} \;

      - name: Validate theme.json Syntax
        run: |
          php -r 'json_decode(file_get_contents("wp-content/themes/secure-centric/theme.json")) !== null or exit(1);'

  deploy:
    name: Deploy to AlmaLinux 10 VPS
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: env.SSH_HOST != ''
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "Pulling latest changes on server..."
            cd /var/www/secure-centric.com || cd /var/www/html || cd /var/www/*
            git pull origin main
            
            # Flush WordPress cache if WP-CLI is installed
            if command -v wp >/dev/null 2>&1; then
              wp cache flush --allow-root || true
            fi
            
            # Reload PHP-FPM to reset OPcache
            systemctl reload php-fpm || true
            echo "Deployment completed successfully!"
