<header class="site-header-sticky-wrapper wp-block-inspect" id="site-header-wrapper" data-wp-block="wp:template-part {slug:'header-sticky-group'}">
  <!-- Navigation Header -->
  <div class="site-header wp-block-inspect" data-wp-block="wp:template-part {slug:'header'}">
    <div class="site-container">
      <div class="header-inner">
        <a href="/" class="site-logo">
          <img src="/wp-content/themes/secure-centric/assets/img/logo.png?v=3.9.2" alt="Secure-Centric Logo" class="site-logo-img" />
          <span>SECURE-CENTRIC</span>
        </a>

        <!-- wp:secure-centric/header-desktop-nav /-->

        <div class="header-actions" style="display: flex; align-items: center; gap: 14px;">
          <a href="https://api.leadconnectorhq.com/widget/booking/nZAjs4Kt86aEyfpwhcll" class="btn btn-primary header-cta-btn" target="_blank" rel="noopener noreferrer">Talk to an Expert &rarr;</a>
          <button type="button" class="nav-mobile-toggle" onclick="window.openMobileDrawer ? window.openMobileDrawer() : null" aria-label="Toggle navigation">☰</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Slide-out Mobile Navigation Drawer -->
  <div class="mobile-nav-backdrop" id="mobile-nav-backdrop" onclick="window.closeMobileDrawer ? window.closeMobileDrawer() : null"></div>
  <div class="mobile-nav-drawer" id="mobile-nav-drawer">
    <div class="mobile-drawer-header">
      <span class="site-logo">
        <img src="/wp-content/themes/secure-centric/assets/img/logo.png?v=3.9.2" alt="Secure-Centric Logo" class="site-logo-img" />
        <span>SECURE-CENTRIC</span>
      </span>
      <button type="button" class="mobile-drawer-close" onclick="window.closeMobileDrawer ? window.closeMobileDrawer() : null" aria-label="Close navigation">✕</button>
    </div>
    <!-- wp:secure-centric/header-mobile-nav /-->
  </div>
</header>
